# Fase 1: source systems + Data Warehouse
services:
  postgres_core:            # simulasi core banking
    image: postgres:16
    container_name: mbdp_pg_core
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: ${PG_CORE_PASSWORD}
    ports: ["15432:5432"]
    volumes:
      - pg_core_data:/var/lib/postgresql/data
      - ./sql/source_postgres:/docker-entrypoint-initdb.d:ro

  mysql_channel:            # simulasi mobile/internet banking
    image: mysql:8.4
    container_name: mbdp_mysql_channel
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: channel_banking
      MYSQL_USER: channel_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/source_mysql:/docker-entrypoint-initdb.d:ro

  mongo_logs:               # NoSQL: log aktivitas
    image: mongo:7
    container_name: mbdp_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  postgres_dwh:             # Data Warehouse (star schema)
    image: postgres:16
    container_name: mbdp_pg_dwh
    environment:
      POSTGRES_DB: dwh
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: ${PG_DWH_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - pg_dwh_data:/var/lib/postgresql/data
      - ./sql/dwh:/docker-entrypoint-initdb.d:ro

volumes:
  pg_core_data:
  mysql_data:
  mongo_data:
  pg_dwh_data:
