name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Java 17, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Build dan jalankan unit test
        run: chmod +x mvnw && ./mvnw -B -ntp verify

  etl:
    name: ETL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            data_generator/requirements.txt
      - name: Install dependency
        run: pip install -r requirements-dev.txt
      - name: Cek sintaks
        run: python -m compileall -q etl data_generator
      - name: Unit test
        run: python -m pytest -q

  compose:
    name: Validasi Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env dari contoh
        run: cp .env.example .env
      - name: Validasi konfigurasi
        run: docker compose config --quiet
